name: Gerar conteúdo com IA gratuita

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema do conteúdo"
        required: true
        type: string
      disciplina:
        description: "Disciplina"
        required: true
        default: "Direito Constitucional"
        type: string
      formato:
        description: "Formato de saída"
        required: true
        type: choice
        options:
          - resumo
          - mapa_mental
          - questoes
          - flashcards
          - carrossel
          - video
      quantidade:
        description: "Quantidade de questões ou flashcards (1 a 10)"
        required: true
        default: "5"
        type: string
      banca:
        description: "Banca de concurso (opcional)"
        required: false
        default: ""
        type: string
      story_id:
        description: "Identificador da pauta do Story (uso interno)"
        required: false
        type: string
      data_publicacao:
        description: "Data planejada do Story (uso interno)"
        required: false
        type: string
      horario_publicacao:
        description: "Horário planejado do Story (uso interno)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Registrar Story como gerando no Supabase
        if: ${{ inputs.formato == 'video' && inputs.story_id != '' }}
        env:
          SUPABASE_URL: https://nukddukqilhsdklocout.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_ID: ${{ inputs.story_id }}
          STORY_TOPIC: ${{ inputs.tema }}
          STORY_DISCIPLINE: ${{ inputs.disciplina }}
          STORY_DATE: ${{ inputs.data_publicacao }}
          STORY_TIME: ${{ inputs.horario_publicacao }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Falta configurar SUPABASE_SERVICE_ROLE_KEY."; exit 1; }
          STORY_DATETIME=""
          if [ -n "$STORY_DATE" ] && [ -n "$STORY_TIME" ]; then
            STORY_DATETIME="${STORY_DATE}T${STORY_TIME}:00-03:00"
          fi
          BODY="$(jq -n \
            --arg id "$STORY_ID" \
            --arg titulo "$STORY_TOPIC" \
            --arg tema "$STORY_TOPIC" \
            --arg disciplina "$STORY_DISCIPLINE" \
            --arg agendado_para "$STORY_DATETIME" \
            '{
              id: $id,
              titulo: $titulo,
              tema: $tema,
              disciplina: $disciplina,
              status: "gerando",
              erro: null
            } + (if $agendado_para == "" then {} else {agendado_para: $agendado_para} end)')"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/instagram_stories?on_conflict=id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY"
          echo "Story $STORY_ID registrado como gerando."

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-ai/requirements.txt

      - name: Instalar Ollama
        if: ${{ inputs.formato != 'video' }}
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) 
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r python-ai/requirements.txt

      - name: Iniciar serviço de conteúdo
        if: ${{ inputs.formato != 'video' }}
        env:
          OLLAMA_MODEL: qwen2.5:3b
          GOOGLE_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1EUof9_ZX-FiLA1GTi8le5AQpccKH08je?usp=sharing
          MATERIALS_DIR: ${{ github.workspace }}/python-ai/materiais
        shell: bash
        run: |
          mkdir -p output
          python -m py_compile python-ai/app.py python-ai/render_instagram.py python-ai/render_video.py
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | grep -q libx264
          echo "Sintaxe Python e ferramentas FFmpeg validadas."
          nohup python -m uvicorn app:app --app-dir python-ai --host 127.0.0.1 --port 8000 > /tmp/aprovaja-api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "API iniciada com sucesso."
              curl -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "O processo da API encerrou antes de ficar disponível."
              cat /tmp/aprovaja-api.log
              exit 1
            fi
            sleep 2
          done
          echo "A API não respondeu dentro do tempo limite. Log de inicialização:"
          cat /tmp/aprovaja-api.log
          exit 1

      - name: Sincronizar materiais públicos do Drive
        if: ${{ inputs.formato != 'video' }}
        continue-on-error: true
        run: |
          curl --max-time 180 -sS -X POST http://127.0.0.1:8000/sync-drive -o output/sincronizacao.json || true
          if [ -f output/sincronizacao.json ]; then cat output/sincronizacao.json; fi

      - name: Gerar conteúdo
        if: ${{ inputs.formato != 'video' }}
        env:
          TEMA: ${{ inputs.tema }}
          DISCIPLINA: ${{ inputs.disciplina }}
          FORMATO: ${{ inputs.formato }}
          QUANTIDADE: ${{ inputs.quantidade }}
          BANCA: ${{ inputs.banca }}
        run: |
          python - <<'PY'
          import json, os, requests
          payload = {
              "topic": os.environ["TEMA"],
              "discipline": os.environ["DISCIPLINA"],
              "kind": os.environ["FORMATO"],
              "quantity": max(1, min(10, int(os.environ["QUANTIDADE"]))),
              "exam_board": os.environ["BANCA"],
          }
          response = requests.post("http://127.0.0.1:8000/generate", json=payload, timeout=660)
          response.raise_for_status()
          data = response.json()
          with open("output/conteudo.md", "w", encoding="utf-8") as f:
              f.write("# " + data["topic"] + "\n\n")
              f.write("**Disciplina:** " + payload["discipline"] + "  \n")
              f.write("**Formato:** " + data["kind"] + "  \n")
              f.write("**Modelo local:** " + data["model"] + "\n\n")
              if data.get("warning"):
                  f.write("> **Atenção:** " + data["warning"] + "\n\n")
              f.write(data["content"] + "\n\n")
              f.write("## Fontes recuperadas pelo sistema\n")
              if data.get("sources"):
                  for s in data["sources"]:
                      suffix = f", página/slide {s['page']}" if s.get("page") else ""
                      f.write(f"- {s['source']}{suffix}\n")
              else:
                  f.write("- Nenhuma fonte local relevante foi recuperada para este tema.\n")
          with open("output/metadata.json", "w", encoding="utf-8") as f:
              json.dump({"request": payload, "model": data.get("model"), "sources": data.get("sources", []), "warnings": data.get("warnings", []), "retrieval": data.get("retrieval", {})}, f, ensure_ascii=False, indent=2)
          print("Conteúdo gerado em output/conteudo.md")
          if data.get("warnings"):
              print("ALERTAS DE QUALIDADE:", data["warnings"])
          PY

      - name: Gerar pacote didático, slides HTML e roteiro com DeepSeek
        if: ${{ inputs.formato == 'video' }}
        env:
          SUPABASE_URL: https://nukddukqilhsdklocout.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_TOPIC: ${{ inputs.tema }}
          STORY_DISCIPLINE: ${{ inputs.disciplina }}
          EXAM_BOARD: ${{ inputs.banca }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          if not key:
              raise SystemExit("SUPABASE_SERVICE_ROLE_KEY não configurada no GitHub.")
          payload = {
              "topic": os.environ["STORY_TOPIC"],
              "discipline": os.environ["STORY_DISCIPLINE"],
              "exam_board": os.environ.get("EXAM_BOARD", "").strip(),
              "slides": 7,
          }
          url = os.environ["SUPABASE_URL"] + "/functions/v1/generate-story-content"
          response = requests.post(url, headers={"Authorization": "Bearer " + key, "apikey": key, "Content-Type": "application/json"}, json=payload, timeout=160)
          try:
              data = response.json()
          except Exception:
              raise SystemExit("A função DeepSeek não retornou JSON: " + response.text[:500])
          if not response.ok or not data.get("ok"):
              raise SystemExit("Falha na geração DeepSeek: " + str(data.get("error", "HTTP " + str(response.status_code))))
          os.makedirs("output", exist_ok=True)
          with open("output/story_assets.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("Pacote gerado pelo provedor:", data.get("provider"), "modelo:", data.get("model"))
          print("Slides HTML:", len(data.get("slides_html", [])), "| cenas:", len(data.get("roteiro", [])))
          print("Conteúdo didático HTML, roteiro e texto de locução recebidos.")
          PY

      - name: Montar artes do Instagram
        if: ${{ inputs.formato != 'video' }}
        run: python python-ai/render_instagram.py

      - name: Instalar Playwright e Chromium para renderizar HTML
        if: ${{ inputs.formato == 'video' }}
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium

      - name: Renderizar slides HTML do DeepSeek
        if: ${{ inputs.formato == 'video' }}
        run: python python-ai/render_story_html.py

      - name: Gerar vídeo vertical para Stories/Reels com narração e trilha
        if: ${{ inputs.formato == 'video' }}
        run: python python-ai/render_video.py

      - name: Enviar vídeo final ao Supabase Storage
        if: ${{ inputs.formato == 'video' && inputs.story_id != '' }}
        env:
          SUPABASE_URL: https://nukddukqilhsdklocout.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_ID: ${{ inputs.story_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Falta configurar o segredo SUPABASE_URL no GitHub."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Falta configurar o segredo SUPABASE_SERVICE_ROLE_KEY no GitHub."; exit 1; }
          test -s output/aprovaja_story.mp4 || { echo "O renderizador não criou output/aprovaja_story.mp4."; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/storage/v1/object/instagram-publicacoes/stories/$STORY_ID.mp4" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @output/aprovaja_story.mp4
          echo "Vídeo enviado ao Supabase Storage para a pauta $STORY_ID."
          VIDEO_URL="$SUPABASE_URL/storage/v1/object/public/instagram-publicacoes/stories/$STORY_ID.mp4"
          curl --fail-with-body --silent --show-error \
            -X PATCH "$SUPABASE_URL/rest/v1/instagram_stories?id=eq.$STORY_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$(jq -n --arg video_path "stories/$STORY_ID.mp4" --arg video_url "$VIDEO_URL" --arg atualizado_em "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:"pronto",video_path:$video_path,video_url:$video_url,erro:null,atualizado_em:$atualizado_em}')"
          echo "Story $STORY_ID atualizado como pronto no banco."

      - name: Registrar falha do Story no Supabase
        if: ${{ failure() && inputs.formato == 'video' && inputs.story_id != '' }}
        env:
          SUPABASE_URL: https://nukddukqilhsdklocout.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_ID: ${{ inputs.story_id }}
        shell: bash
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            MESSAGE="Falha no workflow GitHub Actions. Consulte o log da execução."
            curl --silent --show-error -X PATCH "$SUPABASE_URL/rest/v1/instagram_stories?id=eq.$STORY_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\\"status\\":\\"erro\\",\\"erro\\":\\"$MESSAGE\\",\\"atualizado_em\\":\\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\\"}" || true
          fi

      - name: Disponibilizar arquivos gerados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aprovaja-conteudo-gerado
          path: output/
          if-no-files-found: warn
          retention-days: 7
