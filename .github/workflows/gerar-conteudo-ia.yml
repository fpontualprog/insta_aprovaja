name: Gerar conteúdo com IA gratuita

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema do conteúdo"
        required: true
        type: string
      disciplina:
        description: "Disciplina"
        required: true
        default: "Direito Constitucional"
        type: string
      formato:
        description: "Formato de saída"
        required: true
        type: choice
        options:
          - resumo
          - mapa_mental
          - questoes
          - flashcards
          - carrossel
      quantidade:
        description: "Quantidade de questões ou flashcards (1 a 10)"
        required: true
        default: "5"
        type: string
      banca:
        description: "Banca de concurso"
        required: true
        default: "CEBRASPE"
        type: string

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-ai/requirements.txt

      - name: Instalar Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) 
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r python-ai/requirements.txt

      - name: Iniciar serviço de conteúdo
        env:
          OLLAMA_MODEL: qwen2.5:3b
          GOOGLE_DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1EUof9_ZX-FiLA1GTi8le5AQpccKH08je?usp=sharing
          MATERIALS_DIR: ${{ github.workspace }}/python-ai/materiais
        shell: bash
        run: |
          mkdir -p output
          nohup uvicorn app:app --app-dir python-ai --host 127.0.0.1 --port 8000 > /tmp/aprovaja-api.log 2>&1 &
          API_PID=$!
          ready=false
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "ERRO: o processo Uvicorn encerrou antes de disponibilizar /health."
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::A API do AprovaJá não ficou disponível na porta 8000."
            echo "===== LOG DO UVICORN ====="
            cat /tmp/aprovaja-api.log || true
            echo "===== LOG DO OLLAMA ====="
            tail -n 100 /tmp/ollama.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health

      - name: Sincronizar materiais públicos do Drive
        continue-on-error: true
        run: |
          curl --max-time 180 -sS -X POST http://127.0.0.1:8000/sync-drive -o output/sincronizacao.json || true
          echo "===== RESPOSTA DA SINCRONIZAÇÃO ====="
          if [ -f output/sincronizacao.json ]; then cat output/sincronizacao.json; fi
          echo
          echo "===== LOG DETALHADO DA API (Drive) ====="
          tail -n 120 /tmp/aprovaja-api.log || true

      - name: Diagnóstico automatizado e geração do conteúdo
        env:
          TEMA: ${{ inputs.tema }}
          DISCIPLINA: ${{ inputs.disciplina }}
          FORMATO: ${{ inputs.formato }}
          QUANTIDADE: ${{ inputs.quantidade }}
          BANCA: ${{ inputs.banca }}
        run: python python-ai/diagnostico.py

      - name: Montar artes do Instagram
        run: python python-ai/render_instagram.py

      - name: Disponibilizar arquivos gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprovaja-conteudo-gerado
          path: output/
          if-no-files-found: warn
          retention-days: 7
